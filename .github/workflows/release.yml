name: Build & Publish SONICFLOW Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK (Ready-to-Install)
        run: gradle :app:assembleDebug

      - name: Build Release APK (When Keystore Secrets Configured)
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            gradle :app:assembleRelease
          else
            echo "Release keystore secrets not set; shipping installable debug APK."
          fi

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK for Release Asset
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "SONICFLOW-${TAG}-arm64-universal.apk"
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "SONICFLOW-${TAG}-release.apk"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: SONICFLOW ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            SONICFLOW-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
